name: NDTHICH Repair GĐ3 Finalizer Source Hash

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/repair-gd3-final2-hash.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch verified source SHA and trigger finalizer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/gd3-r3-chunk-final2.yml')
          s=p.read_text(encoding='utf-8')
          old="764232eedddb423ed32bbd2cb1bec23b7eab6089bc98d523876e748117ebdef8"
          new="7043c470ff153b785f039853afc0381ad8c485fdb3fdbd082e2e87ac272742fe"
          assert old in s, 'old incorrect SHA not found'
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('PATCHED_SOURCE_SHA',new)
          PY
          git config user.name "webbyLucifer"
          git config user.email "webby@users.noreply.github.com"
          git add .github/workflows/gd3-r3-chunk-final2.yml
          git commit -m "webby(gd3): fix verified source SHA for Revision 3 final gate"
          git push
