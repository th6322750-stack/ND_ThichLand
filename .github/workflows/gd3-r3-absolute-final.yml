name: NDTHICH GĐ3 Revision 3 Absolute Final

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/gd3-r3-absolute-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install exact font and renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig libcairo2-dev libpango1.0-dev
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow
          mkdir -p "$HOME/.local/share/fonts/BeVietnamPro"
          for f in Regular Medium SemiBold Bold ExtraBold; do
            curl -L --fail --retry 4 \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-${f}.ttf" \
              -o "$HOME/.local/share/fonts/BeVietnamPro/BeVietnamPro-${f}.ttf"
          done
          fc-cache -f
          RESOLVED="$(fc-match -f '%{family}' 'Be Vietnam Pro' | head -1)"
          echo "Resolved font: $RESOLVED"
          [[ "$RESOLVED" == "Be Vietnam Pro"* ]]

      - name: Reconstruct verified approved masters
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, json, shutil
          parts=sorted(Path('.webby/source-parts').glob('master.b64.part*'))
          assert len(parts)==16, [p.name for p in parts]
          text=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(text)==63624, len(text)
          raw=base64.b64decode(text, validate=True)
          actual=hashlib.sha256(raw).hexdigest()
          expected='7043c470ff153b785f039853afc0381ad8c485fdb3fdbd082e2e87ac272742fe'
          assert actual==expected, (actual,expected)
          data=json.loads(lzma.decompress(raw))
          assert len(data)==27
          assert sum(k.startswith('master/public/') for k in data)==18
          assert sum(k.startswith('master/admin/') for k in data)==9
          out=Path('/tmp/ndthich-approved-source')
          if out.exists(): shutil.rmtree(out)
          for rel,svg in data.items():
              dst=out/rel; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_text(svg,encoding='utf-8')
          print('APPROVED_SOURCE_PASS',actual,len(data))
          PY

      - name: Build complete Revision 3 visual authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, shutil, subprocess, html
          import cairosvg
          from PIL import Image

          root=Path('.')
          webby=root/'.webby'
          master=webby/'master'
          assets=webby/'assets/production'
          vh=webby/'visual-handoff'
          qa=webby/'qa'

          # Remove stale active GĐ3 state; source chunks remain until masters are materialized.
          for p in [master, webby/'assets', vh, qa, webby/'bundles', webby/'requests']:
              if p.exists(): shutil.rmtree(p)
          for stale in ['HANDOFF.json','WEBBY_LOCK.json','VALIDATION.json','REV3_PREP.md','DRIVE_MANIFEST.json']:
              p=webby/stale
              if p.exists(): p.unlink()
          for p in [master/'public',master/'admin',master/'system',assets/'icons',assets/'placeholders',assets/'logos',assets/'ornaments',
                    vh/'renders/WEB',vh/'renders/MOBILE',vh/'renders/ADMIN',vh/'renders/SYSTEM',qa]:
              p.mkdir(parents=True,exist_ok=True)

          src=Path('/tmp/ndthich-approved-source/master')
          for p in sorted((src/'public').glob('*.svg')): shutil.copy2(p,master/'public'/p.name)
          for p in sorted((src/'admin').glob('*.svg')): shutil.copy2(p,master/'admin'/p.name)
          assert len(list((master/'public').glob('*.svg')))==18
          assert len(list((master/'admin').glob('*.svg')))==9

          esc=lambda s: html.escape(str(s))
          def state_board(title, groups):
              w=1440; row=166; h=160+row*len(groups)
              out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">',
                   '<rect width="100%" height="100%" fill="#fff"/>',
                   f'<text x="60" y="68" font-family="Be Vietnam Pro" font-size="30" font-weight="800" fill="#8A1822">{esc(title)}</text>',
                   '<text x="60" y="104" font-family="Be Vietnam Pro" font-size="13" font-weight="500" fill="#666">ChatGPT-owned visible state authority — Revision 3</text>']
              y=154
              for name,states in groups:
                  out.append(f'<text x="60" y="{y}" font-family="Be Vietnam Pro" font-size="18" font-weight="700" fill="#171717">{esc(name)}</text>')
                  x=260
                  for st in states:
                      fill='#8A1822' if st in ('hover','active','pressed','selected','success','dirty') else '#F8F6F4'
                      fg='#fff' if fill=='#8A1822' else '#171717'
                      stroke='#8A1822'; sw=2 if st=='focus' else 1
                      if st in ('disabled','loading','saving','uploading'): fill='#E9E5E2'; fg='#777'
                      if st=='error': fill='#FDEBEC'; fg='#B4232C'; stroke='#B4232C'
                      out += [f'<rect x="{x}" y="{y-34}" width="150" height="52" rx="10" fill="{fill}" stroke="{stroke}" stroke-width="{sw}"/>',
                              f'<text x="{x+75}" y="{y-2}" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11" font-weight="700" fill="{fg}">{esc(st.upper())}</text>']
                      x+=165
                  y+=row
              out.append('</svg>'); return ''.join(out)

          boards={
            'Public_Component_States.svg':[
              ('Header',['default','scrolled','drawerOpen']),('PrimaryButton',['default','hover','pressed','focus','disabled']),
              ('PropertyCard',['default','hover','unavailable','loading']),('ProjectCard',['default','hover','selected']),('NewsCard',['default','hover','loading'])],
            'Form_Overlay_States.svg':[
              ('FormField',['default','focus','filled','error','disabled']),('Filter',['default','selected','drawerOpen','empty']),('Gallery',['default','lightbox','loading','error'])],
            'Admin_Component_States.svg':[
              ('AdminSidebar',['expanded','compact','drawer']),('AdminTable',['default','rowHover','empty','loading']),
              ('AdminForm',['default','dirty','saving','error','success']),('Uploader',['empty','uploading','success','error'])]
          }
          for name,groups in boards.items(): (master/'system'/name).write_text(state_board(name.replace('_',' ').replace('.svg',''),groups),encoding='utf-8')

          design='''<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1550" viewBox="0 0 1440 1550"><rect width="1440" height="1550" fill="#fff"/><text x="64" y="72" font-family="Be Vietnam Pro" font-size="32" font-weight="800" fill="#8A1822">NDTHICH LAND — DESIGN SYSTEM / REVISION 3</text><text x="64" y="108" font-family="Be Vietnam Pro" font-size="13" font-weight="500" fill="#777">ChatGPT visual authority • Be Vietnam Pro • NO LOGO • Lead/Booking future feature</text><text x="64" y="180" font-family="Be Vietnam Pro" font-size="21" font-weight="800">COLOR</text><rect x="64" y="210" width="170" height="90" rx="14" fill="#8A1822"/><rect x="254" y="210" width="170" height="90" rx="14" fill="#171717"/><rect x="444" y="210" width="170" height="90" rx="14" fill="#F8F6F4" stroke="#E8E2DF"/><rect x="634" y="210" width="170" height="90" rx="14" fill="#BE8A3F"/><rect x="824" y="210" width="170" height="90" rx="14" fill="#23825C"/><rect x="1014" y="210" width="170" height="90" rx="14" fill="#C43D45"/><text x="64" y="390" font-family="Be Vietnam Pro" font-size="21" font-weight="800">TYPOGRAPHY</text><text x="64" y="460" font-family="Be Vietnam Pro" font-size="56" font-weight="800">Không gian phù hợp</text><text x="64" y="530" font-family="Be Vietnam Pro" font-size="42" font-weight="800">Cho thuê bất động sản</text><text x="64" y="585" font-family="Be Vietnam Pro" font-size="32" font-weight="700">Dự án tiêu biểu</text><text x="64" y="630" font-family="Be Vietnam Pro" font-size="15" font-weight="400" fill="#4D4D4D">Nội dung rõ ràng, dễ đọc và hỗ trợ tiếng Việt.</text><text x="64" y="720" font-family="Be Vietnam Pro" font-size="21" font-weight="800">CONTROLS</text><rect x="64" y="755" width="190" height="50" rx="10" fill="#8A1822"/><text x="159" y="786" text-anchor="middle" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#fff">PRIMARY CTA</text><rect x="274" y="755" width="190" height="50" rx="10" fill="#fff" stroke="#8A1822"/><text x="369" y="786" text-anchor="middle" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#8A1822">SECONDARY</text><rect x="510" y="755" width="350" height="50" rx="10" fill="#fff" stroke="#E8E2DF"/><text x="530" y="786" font-family="Be Vietnam Pro" font-size="13" fill="#777">Form field</text><text x="64" y="900" font-family="Be Vietnam Pro" font-size="21" font-weight="800">LAYOUT</text><rect x="64" y="935" width="820" height="220" rx="18" fill="#F8F6F4"/><text x="92" y="980" font-family="Be Vietnam Pro" font-size="17" font-weight="800">Public WEB</text><text x="92" y="1020" font-family="Be Vietnam Pro" font-size="13">Container 1240 • 12-col • 40px gutter</text><text x="92" y="1055" font-family="Be Vietnam Pro" font-size="13">Property 4/3/2/1 • Project 3/2/1 • Detail sticky ≥1024</text><rect x="920" y="935" width="360" height="220" rx="18" fill="#FCF5F5"/><text x="948" y="980" font-family="Be Vietnam Pro" font-size="17" font-weight="800">Mobile</text><text x="948" y="1020" font-family="Be Vietnam Pro" font-size="13">18px gutter • single column</text><text x="948" y="1055" font-family="Be Vietnam Pro" font-size="13">Drawer / bottom sheet / sticky Call + Zalo</text><text x="64" y="1245" font-family="Be Vietnam Pro" font-size="21" font-weight="800">ADMIN</text><rect x="64" y="1280" width="1216" height="190" rx="18" fill="#F5F6F8"/><rect x="64" y="1280" width="240" height="190" rx="18" fill="#17191D"/><text x="92" y="1325" font-family="Be Vietnam Pro" font-size="14" font-weight="800" fill="#fff">NDTHICH ADMIN</text><text x="340" y="1325" font-family="Be Vietnam Pro" font-size="16" font-weight="800">248px sidebar • tables/forms locked</text><text x="340" y="1365" font-family="Be Vietnam Pro" font-size="13">Rental form follows normalized Sheet; internal fields separated.</text><text x="340" y="1400" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#8A1822">Lead / viewing request is NOT in Revision 3.</text></svg>'''
          (master/'system'/'Design_System_Master.svg').write_text(design,encoding='utf-8')

          icon_paths={'search':'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>','pin':'<path d="M12 22s7-6.3 7-13a7 7 0 1 0-14 0c0 6.7 7 13 7 13Z"/><circle cx="12" cy="9" r="2.4"/>','phone':'<path d="M7 4 4.5 5.5c-.8.5-.4 3.1 1 5.9 1.8 3.7 5.4 7.3 9.1 9.1 2.8 1.4 5.4 1.8 5.9 1l1.5-2.5-5-3-1.5 2c-.4.5-2-.2-3.6-1.3-1.7-1.2-3.6-3.1-4.8-4.8-1.1-1.6-1.8-3.2-1.3-3.6l2-1.5Z"/>','chat':'<path d="M4 5h16v11H9l-5 4V5Z"/>','area':'<path d="M5 5h14v14H5z"/><path d="M8 8h3M8 8v3M16 16h-3M16 16v-3"/>','home':'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>','building':'<path d="M5 21V4h10v17M15 9h4v12M8 8h2M12 8h1M8 12h2M12 12h1M8 16h2M12 16h1"/>','upload':'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/>','filter':'<path d="M4 6h16M7 12h10M10 18h4"/>','menu':'<path d="M4 7h16M4 12h16M4 17h16"/>','check':'<path d="m5 12 4 4 10-10"/>','edit':'<path d="m4 20 4.5-1L19 8.5 15.5 5 5 15.5 4 20Z"/>','trash':'<path d="M5 7h14M9 7V4h6v3M8 10v8M12 10v8M16 10v8M7 7l1 14h8l1-14"/>','bed':'<path d="M3 17v-6h18v6M5 11V8h6c2 0 3 1 3 3M3 17v3M21 17v3"/>'}
          for n,shape in icon_paths.items(): (assets/'icons'/f'{n}.svg').write_text(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{shape}</g></svg>',encoding='utf-8')
          (assets/'logos'/'NO_LOGO.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="14" fill="#F6EAEB" stroke="#8A1822"/><text x="32" y="29" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11" font-weight="800" fill="#8A1822">NO</text><text x="32" y="42" text-anchor="middle" font-family="Be Vietnam Pro" font-size="9" font-weight="800" fill="#8A1822">LOGO</text></svg>',encoding='utf-8')
          for kind,a,b in [('property','#D5D9DD','#939EA7'),('project','#E3D2CA','#9C7869'),('news','#D6DED3','#7E927B')]: (assets/'placeholders'/f'{kind}-placeholder.svg').write_text(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="{a}"/><stop offset="1" stop-color="{b}"/></linearGradient></defs><rect width="800" height="520" rx="24" fill="url(#g)"/><text x="40" y="485" font-family="Be Vietnam Pro" font-size="22" font-weight="700" fill="#fff">{kind.upper()} MEDIA PLACEHOLDER</text></svg>',encoding='utf-8')
          (assets/'ornaments'/'brand-wave.svg').write_text('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240"><path d="M0 160C220 80 380 220 600 135S980 35 1200 105V240H0Z" fill="#8A1822" opacity=".08"/><path d="M0 190C250 110 430 250 660 160S1020 80 1200 135" fill="none" stroke="#BE8A3F" stroke-width="2" opacity=".45"/></svg>',encoding='utf-8')

          public=[('/', '01_TrangChu'),('/cho-thue','02_ChoThue'),('/cho-thue/[slug]','03_ChiTietChoThue'),('/du-an','04_DuAn'),('/du-an/[slug]','05_ChiTietDuAn'),('/gioi-thieu','06_GioiThieu'),('/tin-tuc','07_TinTuc'),('/tin-tuc/[slug]','08_ChiTietTinTuc'),('/lien-he','09_LienHe')]
          routes={'schemaVersion':1,'uiRevision':3,'routes':{}}
          for route,base in public:
              for mode,width in [('WEB',1920),('MOBILE',1080)]:
                  srcp=master/'public'/f'{base}_{mode}.svg'; dst=vh/'renders'/mode/f'{base}_{mode}.png'
                  cairosvg.svg2png(bytestring=srcp.read_bytes(),write_to=str(dst),output_width=width)
              routes['routes'][route]={'desktop':f'renders/WEB/{base}_WEB.png','mobile':f'renders/MOBILE/{base}_MOBILE.png'}
          (vh/'routes.json').write_text(json.dumps(routes,ensure_ascii=False,indent=2),encoding='utf-8')

          admin=[]
          for p in sorted((master/'admin').glob('*.svg')):
              dst=vh/'renders/ADMIN'/(p.stem+'.png'); cairosvg.svg2png(bytestring=p.read_bytes(),write_to=str(dst),output_width=1920); admin.append({'master':f'.webby/master/admin/{p.name}','render':f'renders/ADMIN/{dst.name}'})
          system=[]
          for p in sorted((master/'system').glob('*.svg')):
              dst=vh/'renders/SYSTEM'/(p.stem+'.png'); cairosvg.svg2png(bytestring=p.read_bytes(),write_to=str(dst),output_width=1920); system.append({'master':f'.webby/master/system/{p.name}','render':f'renders/SYSTEM/{dst.name}'})
          (vh/'admin-renders.json').write_text(json.dumps({'schemaVersion':1,'uiRevision':3,'admin':admin,'system':system},ensure_ascii=False,indent=2),encoding='utf-8')
          (vh/'APPROVED_VISUALS.md').write_text('# NDTHICH Approved Visual Truth — Revision 3\n\nDirect Git PNG renders + matching SVG masters are the approved visual authority. NO_LOGO is intentional. Viewing-request/Lead is a future feature. Claude must not redesign.\n',encoding='utf-8')

          intake={'schemaVersion':1,'status':'INTAKE_COMPLETE','project':{'name':'NDTHICH Land','businessOrOffer':'Website bất động sản cho thuê và giới thiệu dự án cho Công ty TNHH Đầu tư & Kinh doanh Nguyễn Đắc Thích'},'goal':{'primary':'Giúp khách tìm BĐS cho thuê, xem dự án và liên hệ trực tiếp.','conversion':['Gọi hotline','Nhắn Zalo','Gửi yêu cầu tư vấn chung']},'audience':{'primary':['Sinh viên','Người đi làm','Gia đình','Nhà đầu tư']},'scope':{'routes':[x[0] for x in public],'features':['Rental search/filter','Rental detail','Projects','News','Call/Zalo/contact form','Admin CMS rental/project/news/media']},'personalizationSignals':['Phong cách BĐS chuyên nghiệp đỏ rượu vang/trắng/đen nhấn vàng','Nguồn thuê đa loại hình từ Sheet thực tế','Mobile-first, giá và diện tích công khai'],'gaps':[{'field':'productionLogo','status':'SOFT_GAP','handling':'NO_LOGO placeholder approved; replace in later revision.'},{'field':'viewingRequestLead','status':'NOT_APPLICABLE','handling':'Future feature; excluded from Revision 3.'}]}
          (webby/'PROJECT_INTAKE.json').write_text(json.dumps(intake,ensure_ascii=False,indent=2),encoding='utf-8')

          tokens={'schemaVersion':1,'uiRevision':3,'colors':{'primary':'#8A1822','primaryHover':'#70131B','gold':'#BE8A3F','ink':'#171717','body':'#4D4D4D','muted':'#7A7A7A','line':'#E8E2DF','surface':'#FFFFFF','soft':'#F8F6F4','footer':'#151515','success':'#23825C','error':'#C43D45'},'spacing':[4,8,12,16,20,24,32,40,48,64,80,96],'radii':[6,10,14,20,28,999],'container':{'desktop':1240,'desktopGutter':40,'mobileGutter':18}}
