name: NDTHICH Trigger Final GĐ3 Gate

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/fix-gd3-bundles.yml

permissions:
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify repaired source bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          checks=[
            (Path('.webby/bundles/NDTHICH_UI_REV2_SVG_MASTER_BUNDLE.zip'),29),
            (Path('.webby/bundles/NDTHICH_REV3_STATE_LAYER_BUNDLE.zip'),2),
          ]
          for p,min_entries in checks:
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip(); assert bad is None,(p,bad)
                  assert len(z.namelist())>=min_entries,(p,len(z.namelist()))
                  print('VALID',p,p.stat().st_size,'bytes',len(z.namelist()),'entries')
          PY
      - name: Trigger final gate on current repaired head
        run: |
          git config user.name "Hthanh-Vip"
          git config user.email "th6322750@gmail.com"
          printf '\n# verified-binary-bundle-trigger: 2026-08-13-final\n' >> .github/workflows/gd3-r3-final.yml
          git add .github/workflows/gd3-r3-final.yml
          git commit -m "webby(gd3): trigger final gate from verified binary bundles"
          git push origin HEAD:webby/ui-ndthich-r3-final
