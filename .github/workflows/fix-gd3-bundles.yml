name: NDTHICH Repair GĐ3 Bundles From Drive

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/fix-gd3-bundles.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download verified Revision 2 source package from Drive
        run: |
          python -m pip install --quiet gdown
          gdown --id 1lz06ZbcQy-jPY-xOwNX92R_sbJnPLkae -O /tmp/NDTHICH_UI_REV2_FULL.zip
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('/tmp/NDTHICH_UI_REV2_FULL.zip')
          assert p.is_file() and p.stat().st_size > 10_000_000, p.stat().st_size if p.exists() else 'missing'
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              assert bad is None, bad
              names=z.namelist()
              assert sum(x.startswith('NDTHICH_UI_REV2/master/public/') and x.endswith('.svg') for x in names)==18
              assert sum(x.startswith('NDTHICH_UI_REV2/master/admin/') and x.endswith('.svg') for x in names)==9
              assert 'NDTHICH_UI_REV2/master/system/Design_System_Master.svg' in names
              print('DRIVE SOURCE VERIFIED', p.stat().st_size, 'bytes', len(names), 'entries')
          PY

      - name: Rebuild clean Git source bundles
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, shutil

          src=Path('/tmp/NDTHICH_UI_REV2_FULL.zip')
          outdir=Path('.webby/bundles')
          outdir.mkdir(parents=True,exist_ok=True)
          page=outdir/'NDTHICH_UI_REV2_SVG_MASTER_BUNDLE.zip'
          state=outdir/'NDTHICH_REV3_STATE_LAYER_BUNDLE.zip'
          for p in [page,state]:
              if p.exists(): p.unlink()

          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(page,'w',zipfile.ZIP_DEFLATED) as zout:
              for name in zin.namelist():
                  if name.startswith('NDTHICH_UI_REV2/master/') and name.endswith('.svg'):
                      rel=name[len('NDTHICH_UI_REV2/'):]
                      zout.writestr(rel, zin.read(name))

          # Valid state bundle. Final gate owns the Revision-3 state boards and will
          # generate explicit boards if these names are not present.
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(state,'w',zipfile.ZIP_DEFLATED) as zout:
              for name in ['NDTHICH_UI_REV2/master/system/Component_States.svg','NDTHICH_UI_REV2/master/system/Design_System_Master.svg']:
                  if name in zin.namelist():
                      rel=name[len('NDTHICH_UI_REV2/'):]
                      zout.writestr(rel, zin.read(name))
              zout.writestr('REV3_STATE_SOURCE_NOTE.txt','Revision 3 explicit state boards are generated by gd3-r3-final.yml.\n')

          for p,minimum in [(page,28),(state,1)]:
              with zipfile.ZipFile(p) as z:
                  bad=z.testzip(); assert bad is None, (p,bad)
                  count=len(z.namelist()); assert count>=minimum, (p,count)
                  print(p,'VALID ZIP',count,'entries',p.stat().st_size,'bytes')
          PY

      - name: Commit repaired bundles and trigger final gate
        run: |
          git config user.name "Hthanh-Vip"
          git config user.email "th6322750@gmail.com"
          printf '\n# drive-source-bundle-repair: 2026-08-13-r2\n' >> .github/workflows/gd3-r3-final.yml
          git add .webby/bundles/NDTHICH_UI_REV2_SVG_MASTER_BUNDLE.zip \
                  .webby/bundles/NDTHICH_REV3_STATE_LAYER_BUNDLE.zip \
                  .github/workflows/gd3-r3-final.yml
          git commit -m "webby(fix): rebuild GĐ3 source bundles from verified Drive package"
          git push origin HEAD:webby/ui-ndthich-r3-final
