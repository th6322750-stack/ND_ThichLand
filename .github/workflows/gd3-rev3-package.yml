name: NDTHICH Rev3 Package Approved Renders

on:
  push:
    branches:
      - webby/ui-ndthich-r2
    paths:
      - .github/workflows/gd3-rev3-package.yml

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify render set exists
        run: |
          test "$(find .webby/visual-handoff/renders/WEB -name '*.png' | wc -l)" -eq 9
          test "$(find .webby/visual-handoff/renders/MOBILE -name '*.png' | wc -l)" -eq 9
          test "$(find .webby/visual-handoff/renders/ADMIN -name '*.png' | wc -l)" -eq 9
          test -f .webby/qa/FONT_RENDER_VERIFICATION.json
          grep -q '"resolvedFamily": "Be Vietnam Pro"' .webby/qa/FONT_RENDER_VERIFICATION.json
      - name: Build client render package
        run: |
          mkdir -p package/'bản WEB' package/'bản MOBILE' package/'bản ADMIN' package/'Document fonts'
          cp .webby/visual-handoff/renders/WEB/*.png package/'bản WEB'/
          cp .webby/visual-handoff/renders/MOBILE/*.png package/'bản MOBILE'/
          cp .webby/visual-handoff/renders/ADMIN/*.png package/'bản ADMIN'/
          cp .webby/visual-handoff/renders/SYSTEM/*.png package/'bản ADMIN'/
          cp .webby/font-manifest.json package/'Document fonts'/font-manifest.json
          cp .webby/qa/FONT_RENDER_VERIFICATION.json package/'Document fonts'/font-render-verification.json
          cd package && zip -qr ../NDTHICH_REV3_APPROVED_RENDERS.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: NDTHICH_REV3_APPROVED_RENDERS
          path: NDTHICH_REV3_APPROVED_RENDERS.zip
          if-no-files-found: error
          retention-days: 14
