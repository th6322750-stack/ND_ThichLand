              (assets/'placeholders'/f'{kind}-placeholder.svg').write_text(f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="{a}"/><stop offset="1" stop-color="{b}"/></linearGradient></defs><rect width="800" height="520" rx="24" fill="url(#g)"/><text x="40" y="485" font-family="Be Vietnam Pro" font-size="22" font-weight="700" fill="#fff">{kind.upper()} MEDIA PLACEHOLDER</text></svg>',encoding='utf-8')
