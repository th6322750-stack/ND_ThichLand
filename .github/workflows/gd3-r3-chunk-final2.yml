name: NDTHICH GĐ3 R3 Chunk Final Gate 2

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/gd3-r3-chunk-final2.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render dependencies and exact font
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig libcairo2-dev libpango1.0-dev
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow
          mkdir -p "$HOME/.local/share/fonts/BeVietnamPro"
          for f in Regular Medium SemiBold Bold ExtraBold; do
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-${f}.ttf" \
              -o "$HOME/.local/share/fonts/BeVietnamPro/BeVietnamPro-${f}.ttf"
          done
          fc-cache -f
          test "$(fc-match -f '%{family}' 'Be Vietnam Pro' | head -1)" = "Be Vietnam Pro"

      - name: Reconstruct and verify authoritative master source
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,json,shutil
          parts=sorted(Path('.webby/source-parts').glob('master.b64.part*'))
          assert len(parts)==16,[p.name for p in parts]
          text=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          assert len(text)==63624,len(text)
          raw=base64.b64decode(text,validate=True)
          expected='764232eedddb423ed32bbd2cb1bec23b7eab6089bc98d523876e748117ebdef8'
          actual=hashlib.sha256(raw).hexdigest()
          assert actual==expected,(actual,expected)
          data=json.loads(lzma.decompress(raw))
          assert len(data)==27,len(data)
          assert sum(k.startswith('master/public/') for k in data)==18
          assert sum(k.startswith('master/admin/') for k in data)==9
          out=Path('_page_src')
          if out.exists(): shutil.rmtree(out)
          for rel,svg in data.items():
              dest=out/rel
              dest.parent.mkdir(parents=True,exist_ok=True)
              dest.write_text(svg,encoding='utf-8')
          print('CHUNK_SOURCE_PASS',len(data),actual)
          PY

      - name: Build Revision 3 direct visual authority and contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,subprocess,html
          import cairosvg
          from PIL import Image

          root=Path('.')
          master=root/'.webby/master'
          assets=root/'.webby/assets/production'
          vh=root/'.webby/visual-handoff'
          qa=root/'.webby/qa'
          for p in [master,assets,vh/'renders']:
              if p.exists(): shutil.rmtree(p)
          for p in [master/'public',master/'admin',master/'system',
                    assets/'icons',assets/'placeholders',assets/'logos',assets/'ornaments',
                    vh/'renders/WEB',vh/'renders/MOBILE',vh/'renders/ADMIN',vh/'renders/SYSTEM',qa]:
              p.mkdir(parents=True,exist_ok=True)
          if (vh/'refs').exists(): shutil.rmtree(vh/'refs')

          public=[
            ('/','01_TrangChu'),('/cho-thue','02_ChoThue'),('/cho-thue/[slug]','03_ChiTietChoThue'),
            ('/du-an','04_DuAn'),('/du-an/[slug]','05_ChiTietDuAn'),('/gioi-thieu','06_GioiThieu'),
            ('/tin-tuc','07_TinTuc'),('/tin-tuc/[slug]','08_ChiTietTinTuc'),('/lien-he','09_LienHe')]
          for _,base in public:
              for suffix in ['WEB','MOBILE']:
                  src=root/'_page_src/master/public'/f'{base}_{suffix}.svg'
                  assert src.is_file(),src
                  shutil.copy2(src,master/'public'/src.name)
          admin_names=['01_Admin_Login.svg','02_Admin_Dashboard.svg','03_Admin_BDS_List.svg','04_Admin_BDS_Form.svg',
                       '05_Admin_DuAn_List.svg','06_Admin_DuAn_Form.svg','07_Admin_TinTuc_List.svg','08_Admin_TinTuc_Form.svg','09_Admin_Media.svg']
          for name in admin_names:
              src=root/'_page_src/master/admin'/name
              assert src.is_file(),src
              shutil.copy2(src,master/'admin'/name)

          esc=lambda s: html.escape(str(s))
          def board(title, groups):
              w=1440; row=170; h=160+row*len(groups)
              out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">',
                   '<rect width="100%" height="100%" fill="#fff"/>',
                   f'<text x="60" y="70" font-family="Be Vietnam Pro" font-size="30" font-weight="800" fill="#8A1822">{esc(title)}</text>',
                   '<text x="60" y="105" font-family="Be Vietnam Pro" font-size="13" font-weight="500" fill="#666">ChatGPT-owned visible state authority — Revision 3</text>']
              y=155
              for name,states in groups:
                  out.append(f'<text x="60" y="{y}" font-family="Be Vietnam Pro" font-size="18" font-weight="700" fill="#171717">{esc(name)}</text>')
                  x=260
