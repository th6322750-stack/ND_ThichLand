          <rect x="274" y="755" width="190" height="50" rx="10" fill="#fff" stroke="#8A1822"/><text x="369" y="786" text-anchor="middle" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#8A1822">SECONDARY</text>
          <rect x="510" y="755" width="350" height="50" rx="10" fill="#fff" stroke="#E8E2DF"/><text x="530" y="786" font-family="Be Vietnam Pro" font-size="13" fill="#777">Form field</text>
