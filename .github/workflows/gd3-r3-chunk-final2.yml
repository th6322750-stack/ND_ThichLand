          <text x="92" y="1020" font-family="Be Vietnam Pro" font-size="13">Container 1240 • 12-col • 40px gutter</text><text x="92" y="1055" font-family="Be Vietnam Pro" font-size="13">Property 4/3/2/1 • Project 3/2/1 • Detail sticky ≥1024</text>
          <rect x="920" y="935" width="360" height="220" rx="18" fill="#FCF5F5"/><text x="948" y="980" font-family="Be Vietnam Pro" font-size="17" font-weight="800">Mobile</text>
          <text x="948" y="1020" font-family="Be Vietnam Pro" font-size="13">18px gutter • single column</text><text x="948" y="1055" font-family="Be Vietnam Pro" font-size="13">Drawer / bottom sheet / sticky Call + Zalo</text>
          <text x="64" y="1245" font-family="Be Vietnam Pro" font-size="21" font-weight="800">ADMIN</text>
