            'upload':'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/>','filter':'<path d="M4 6h16M7 12h10M10 18h4"/>','menu':'<path d="M4 7h16M4 12h16M4 17h16"/>','check':'<path d="m5 12 4 4 10-10"/>'}
