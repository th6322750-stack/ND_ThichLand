          <text x="92" y="1325" font-family="Be Vietnam Pro" font-size="14" font-weight="800" fill="#fff">NDTHICH ADMIN</text><text x="340" y="1325" font-family="Be Vietnam Pro" font-size="16" font-weight="800">248px sidebar • tables/forms locked</text>
          <text x="340" y="1365" font-family="Be Vietnam Pro" font-size="13">Rental form follows normalized Sheet; internal fields separated.</text><text x="340" y="1400" font-family="Be Vietnam Pro" font-size="13" font-weight="700" fill="#8A1822">Lead / viewing request is NOT in Revision 3.</text>
          </svg>'''
