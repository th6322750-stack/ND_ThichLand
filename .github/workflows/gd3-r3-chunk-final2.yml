                      if st=='focus': fill='#fff'; fg='#8A1822'
                      sw=2 if st=='focus' else 1
                      out += [f'<rect x="{x}" y="{y-34}" width="150" height="52" rx="10" fill="{fill}" stroke="#8A1822" stroke-width="{sw}"/>',
                              f'<text x="{x+75}" y="{y-2}" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11" font-weight="700" fill="{fg}">{esc(st.upper())}</text>']
