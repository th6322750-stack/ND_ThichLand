name: NDTHICH GĐ3 R3 Final Gate

on:
  push:
    branches:
      - webby/ui-ndthich-r3-final
    paths:
      - .github/workflows/gd3-r3-final.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fontconfig libcairo2-dev libpango1.0-dev unzip
          python -m pip install --upgrade pip
          python -m pip install cairosvg pillow

      - name: Install exact Be Vietnam Pro
        run: |
          mkdir -p "$HOME/.local/share/fonts/BeVietnamPro"
          for f in Regular Medium SemiBold Bold ExtraBold; do
            curl -L --fail --retry 3 \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-${f}.ttf" \
              -o "$HOME/.local/share/fonts/BeVietnamPro/BeVietnamPro-${f}.ttf"
          done
          fc-cache -f
          test "$(fc-match -f '%{family}' 'Be Vietnam Pro' | head -1)" = "Be Vietnam Pro"

      - name: Build direct Revision 3 visual authority
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, shutil, json, hashlib, subprocess
          import cairosvg
          from PIL import Image

          root = Path('.')
          page_zip = root/'.webby/bundles/NDTHICH_UI_REV2_SVG_MASTER_BUNDLE.zip'
          state_zip = root/'.webby/bundles/NDTHICH_REV3_STATE_LAYER_BUNDLE.zip'
          assert page_zip.is_file(), page_zip
          assert state_zip.is_file(), state_zip

          for d in ['_page_src','_state_src']:
              p=root/d
              if p.exists(): shutil.rmtree(p)
              p.mkdir()

          with zipfile.ZipFile(page_zip) as z:
              bad=z.testzip()
              assert bad is None, f'page bundle corrupt at {bad}'
              z.extractall(root/'_page_src')
              print('PAGE ZIP ENTRIES', len(z.namelist()))
          with zipfile.ZipFile(state_zip) as z:
              bad=z.testzip()
              assert bad is None, f'state bundle corrupt at {bad}'
              z.extractall(root/'_state_src')
              print('STATE ZIP ENTRIES', len(z.namelist()))

          def find_named(name, roots):
              hits=[]
              for rr in roots:
                  hits += list(rr.rglob(name))
              if not hits:
                  return None
              hits.sort(key=lambda p: len(p.parts))
              return hits[0]

          master = root/'.webby/master'
          assets = root/'.webby/assets/production'
          vh = root/'.webby/visual-handoff'
          qa = root/'.webby/qa'
          for p in [master, assets, vh/'renders', qa]:
              p.mkdir(parents=True, exist_ok=True)

          for p in [master/'public', master/'admin', master/'system',
                    assets/'icons', assets/'placeholders', assets/'logos', assets/'ornaments',
                    vh/'renders']:
              if p.exists(): shutil.rmtree(p)
              p.mkdir(parents=True, exist_ok=True)
          if (vh/'refs').exists():
              shutil.rmtree(vh/'refs')

          public = [
              ('/','01_TrangChu'),
              ('/cho-thue','02_ChoThue'),
              ('/cho-thue/[slug]','03_ChiTietChoThue'),
              ('/du-an','04_DuAn'),
              ('/du-an/[slug]','05_ChiTietDuAn'),
              ('/gioi-thieu','06_GioiThieu'),
              ('/tin-tuc','07_TinTuc'),
              ('/tin-tuc/[slug]','08_ChiTietTinTuc'),
              ('/lien-he','09_LienHe'),
          ]
          for route,base in public:
              for suffix in ['WEB','MOBILE']:
                  name=f'{base}_{suffix}.svg'
                  src=find_named(name,[root/'_page_src'])
                  assert src, f'missing public master {name}'
                  shutil.copy2(src, master/'public'/name)

          admin_names = [
              '01_Admin_Login.svg','02_Admin_Dashboard.svg','03_Admin_BDS_List.svg',
              '04_Admin_BDS_Form.svg','05_Admin_DuAn_List.svg','06_Admin_DuAn_Form.svg',
              '07_Admin_TinTuc_List.svg','08_Admin_TinTuc_Form.svg','09_Admin_Media.svg'
          ]
          for name in admin_names:
              src=find_named(name,[root/'_page_src'])
              assert src, f'missing admin master {name}'
              shutil.copy2(src, master/'admin'/name)

          design_src=find_named('Design_System_Master.svg',[root/'_page_src',root/'_state_src'])
          assert design_src, 'missing Design_System_Master.svg'
          shutil.copy2(design_src, master/'system'/'Design_System_Master.svg')

          def fallback_board(title, groups):
              w=1440; row=170; h=160+row*len(groups)
              esc=lambda s: (str(s).replace('&','&amp;').replace('<','&lt;').replace('>','&gt;'))
              out=[f'<svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">',
                   '<rect width="100%" height="100%" fill="#fff"/>',
                   f'<text x="60" y="70" font-family="Be Vietnam Pro" font-size="30" font-weight="800" fill="#8A1822">{esc(title)}</text>',
                   '<text x="60" y="105" font-family="Be Vietnam Pro" font-size="13" font-weight="500" fill="#666">ChatGPT-owned visible state authority — Revision 3</text>']
              y=155
              for name,states in groups:
                  out.append(f'<text x="60" y="{y}" font-family="Be Vietnam Pro" font-size="18" font-weight="700" fill="#171717">{esc(name)}</text>')
                  x=260
                  for st in states:
                      fill='#8A1822' if st in ('hover','active','pressed','selected','success') else '#F8F6F4'
                      fg='#fff' if fill=='#8A1822' else '#171717'
                      if st in ('disabled','loading'): fill='#E9E5E2'; fg='#777'
                      if st in ('error',): fill='#FDEBEC'; fg='#B4232C'
                      if st in ('focus',): fill='#FFF'; fg='#8A1822'
                      sw = 2 if st=='focus' else 1
                      out.append(f'<rect x="{x}" y="{y-34}" width="150" height="52" rx="10" fill="{fill}" stroke="#8A1822" stroke-width="{sw}"/>')
                      out.append(f'<text x="{x+75}" y="{y-2}" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11" font-weight="700" fill="{fg}">{esc(st.upper())}</text>')
                      x+=165
                  y+=row
              out.append('</svg>')
              return ''.join(out)

          state_boards = {
              'Public_Component_States.svg': [
                  ('Header',['default','scrolled','drawerOpen']),
                  ('PrimaryButton',['default','hover','pressed','focus','disabled']),
                  ('PropertyCard',['default','hover','unavailable','loading']),
                  ('ProjectCard',['default','hover','selected']),
                  ('NewsCard',['default','hover','loading']),
              ],
              'Form_Overlay_States.svg': [
                  ('FormField',['default','focus','filled','error','disabled']),
                  ('Filter',['default','selected','drawerOpen','empty']),
                  ('Gallery',['default','lightbox','loading','error']),
              ],
              'Admin_Component_States.svg': [
                  ('AdminSidebar',['expanded','compact','drawer']),
                  ('AdminTable',['default','rowHover','empty','loading']),
                  ('AdminForm',['default','dirty','saving','error','success']),
                  ('Uploader',['empty','uploading','success','error']),
              ],
          }
          for name,groups in state_boards.items():
              src=find_named(name,[root/'_state_src'])
              target=master/'system'/name
              if src:
                  shutil.copy2(src,target)
              else:
                  target.write_text(fallback_board(name.replace('_',' ').replace('.svg',''),groups),encoding='utf-8')

          icon_paths = {
              'search':'<circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/>',
              'pin':'<path d="M12 22s7-6.3 7-13a7 7 0 1 0-14 0c0 6.7 7 13 7 13Z"/><circle cx="12" cy="9" r="2.4"/>',
              'phone':'<path d="M7 4 4.5 5.5c-.8.5-.4 3.1 1 5.9 1.8 3.7 5.4 7.3 9.1 9.1 2.8 1.4 5.4 1.8 5.9 1l1.5-2.5-5-3-1.5 2c-.4.5-2-.2-3.6-1.3-1.7-1.2-3.6-3.1-4.8-4.8-1.1-1.6-1.8-3.2-1.3-3.6l2-1.5Z"/>',
              'chat':'<path d="M4 5h16v11H9l-5 4V5Z"/>',
              'area':'<path d="M5 5h14v14H5z"/><path d="M8 8h3M8 8v3M16 16h-3M16 16v-3"/>',
              'home':'<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',
              'building':'<path d="M5 21V4h10v17M15 9h4v12M8 8h2M12 8h1M8 12h2M12 12h1M8 16h2M12 16h1"/>',
              'upload':'<path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v5h16v-5"/>',
              'filter':'<path d="M4 6h16M7 12h10M10 18h4"/>',
              'menu':'<path d="M4 7h16M4 12h16M4 17h16"/>',
              'check':'<path d="m5 12 4 4 10-10"/>',
          }
          for n,shape in icon_paths.items():
              (assets/'icons'/f'{n}.svg').write_text(
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{shape}</g></svg>',
                  encoding='utf-8')

          (assets/'logos'/'NO_LOGO.svg').write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect x="1" y="1" width="62" height="62" rx="14" fill="#F6EAEB" stroke="#8A1822"/><text x="32" y="29" text-anchor="middle" font-family="Be Vietnam Pro" font-size="11" font-weight="800" fill="#8A1822">NO</text><text x="32" y="42" text-anchor="middle" font-family="Be Vietnam Pro" font-size="9" font-weight="800" fill="#8A1822">LOGO</text></svg>',
              encoding='utf-8')
          for kind,a,b in [('property','#D5D9DD','#939EA7'),('project','#E3D2CA','#9C7869'),('news','#D6DED3','#7E927B')]:
              (assets/'placeholders'/f'{kind}-placeholder.svg').write_text(
                  f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="{a}"/><stop offset="1" stop-color="{b}"/></linearGradient></defs><rect width="800" height="520" rx="24" fill="url(#g)"/><g fill="#fff" opacity=".78"><rect x="95" y="180" width="90" height="250" rx="5"/><rect x="225" y="120" width="120" height="310" rx="5"/><rect x="390" y="210" width="105" height="220" rx="5"/><rect x="540" y="150" width="125" height="280" rx="5"/></g><text x="40" y="485" font-family="Be Vietnam Pro" font-size="22" font-weight="700" fill="#fff">{kind.upper()} MEDIA PLACEHOLDER</text></svg>',
                  encoding='utf-8')
          (assets/'ornaments'/'brand-wave.svg').write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240"><path d="M0 160C220 80 380 220 600 135S980 35 1200 105V240H0Z" fill="#8A1822" opacity=".08"/><path d="M0 190C250 110 430 250 660 160S1020 80 1200 135" fill="none" stroke="#BE8A3F" stroke-width="2" opacity=".45"/></svg>',
              encoding='utf-8')

          for sub in ['WEB','MOBILE','ADMIN','SYSTEM']:
              (vh/'renders'/sub).mkdir(parents=True,exist_ok=True)
          routes={'schemaVersion':1,'uiRevision':3,'uiCommit':'PENDING_VISUAL_COMMIT','routes':{}}
          for route,base in public:
              dp=vh/'renders/WEB'/f'{base}_WEB.png'
              mp=vh/'renders/MOBILE'/f'{base}_MOBILE.png'
              cairosvg.svg2png(bytestring=(master/'public'/f'{base}_WEB.svg').read_bytes(),write_to=str(dp),output_width=1920)
              cairosvg.svg2png(bytestring=(master/'public'/f'{base}_MOBILE.svg').read_bytes(),write_to=str(mp),output_width=1080)
              routes['routes'][route]={'desktop':f'renders/WEB/{dp.name}','mobile':f'renders/MOBILE/{mp.name}'}
          (vh/'routes.json').write_text(json.dumps(routes,ensure_ascii=False,indent=2),encoding='utf-8')

          admin_entries=[]
          for p in sorted((master/'admin').glob('*.svg')):
              target=vh/'renders/ADMIN'/(p.stem+'.png')
              cairosvg.svg2png(bytestring=p.read_bytes(),write_to=str(target),output_width=1920)
              admin_entries.append({'master':f'.webby/master/admin/{p.name}','render':f'renders/ADMIN/{target.name}'})
          system_entries=[]
          for p in sorted((master/'system').glob('*.svg')):
              target=vh/'renders/SYSTEM'/(p.stem+'.png')
              cairosvg.svg2png(bytestring=p.read_bytes(),write_to=str(target),output_width=1920)
              system_entries.append({'master':f'.webby/master/system/{p.name}','render':f'renders/SYSTEM/{target.name}'})
          (vh/'admin-renders.json').write_text(json.dumps({'schemaVersion':1,'uiRevision':3,'uiCommit':'PENDING_VISUAL_COMMIT','admin':admin_entries,'system':system_entries},ensure_ascii=False,indent=2),encoding='utf-8')

          colors={'primary':'#8A1822','primaryHover':'#70131B','primarySoft':'#F6EAEB','ink':'#171717','body':'#4D4D4D','muted':'#7A7A7A','line':'#E8E2DF','surface':'#FFFFFF','soft':'#F8F6F4','footer':'#151515','gold':'#BE8A3F','success':'#23825C','error':'#C43D45'}
          tokens={'schemaVersion':3,'uiRevision':3,'colors':colors,'spacing':[4,8,12,16,20,24,32,40,48,64,80,96,112],'radii':{'xs':6,'sm':10,'md':14,'lg':20,'xl':28,'pill':999},'container':{'desktop':1240,'wide':1360,'desktopGutter':40,'mobileGutter':18},'grid':{'desktopColumns':12,'tabletColumns':8,'mobileColumns':4},'shadows':{'card':'0 12px 34px rgba(18,18,18,.08)','floating':'0 20px 50px rgba(18,18,18,.14)'}}
          typography={'schemaVersion':3,'uiRevision':3,'family':'Be Vietnam Pro','fallback':['Noto Sans','Arial','sans-serif'],'weights':[400,500,600,700,800],'roles':{
              'display':{'weight':800,'desktop':56,'mobile':36,'lineHeight':1.12,'letterSpacing':'-0.035em'},
              'h1':{'weight':800,'desktop':42,'mobile':30,'lineHeight':1.18,'letterSpacing':'-0.025em'},
              'h2':{'weight':700,'desktop':32,'mobile':25,'lineHeight':1.25,'letterSpacing':'-0.018em'},
              'h3':{'weight':700,'desktop':22,'mobile':20,'lineHeight':1.32,'letterSpacing':'-0.01em'},
              'bodyLg':{'weight':400,'desktop':17,'mobile':16,'lineHeight':1.68},
              'body':{'weight':400,'desktop':15,'mobile':14,'lineHeight':1.6},
              'label':{'weight':600,'desktop':13,'mobile':13,'lineHeight':1.4},
              'caption':{'weight':500,'desktop':12,'mobile':12,'lineHeight':1.45},
              'nav':{'weight':600,'desktop':13,'mobile':15,'lineHeight':1.3},
              'button':{'weight':700,'desktop':13,'mobile':13,'lineHeight':1.0},
              'price':{'weight':800,'desktop':18,'mobile':18,'lineHeight':1.25},
              'adminTitle':{'weight':700,'desktop':28,'mobile':24,'lineHeight':1.25},
              'adminTable':{'weight':500,'desktop':13,'mobile':13,'lineHeight':1.45}}}
          font_manifest={'version':3,'uiRevision':3,'family':'Be Vietnam Pro','weights':[400,500,600,700,800],'styles':['normal'],'source':'Google Fonts / google/fonts/ofl/bevietnampro','license':'OFL','binaryIncluded':False,'mustNot':['Do not substitute another font.','Do not infer missing weights.']}
          responsive={'schemaVersion':3,'uiRevision':3,'breakpoints':{'xs':0,'sm':480,'md':768,'lg':1024,'xl':1280,'2xl':1536},'rules':{
              'publicHeader':'desktop nav >=1024; mobile header + full-height drawer <1024',
              'propertyGrid':'4 cols >=1440, 3 cols 1024-1439, 2 cols 768-1023, 1 col <768',
              'projectGrid':'3/2/1 at 1024/768/<768','detail':'sticky desktop aside >=1024; inline contact <1024',
              'gallery':'desktop mosaic; mobile swipe strip','adminSidebar':'248px >=1200; 76px 768-1199; drawer <768',
              'adminTables':'horizontal scroll <900','adminForms':'2-col >=1200; 1-col <1200'},'export':{'webMinWidth':1920,'mobileMinWidth':1080}}
          layer_map={'schemaVersion':1,'uiRevision':3,'layers':{'baseContent':0,'stickyHeader':100,'stickyMobileActions':200,'drawerBackdrop':900,'drawerPanel':910,'bottomSheetBackdrop':920,'bottomSheetPanel':930,'lightboxBackdrop':1000,'lightboxContent':1010,'toast':1100},'rules':['Drawer/lightbox backdrops cover sticky header.','Sticky mobile actions remain below drawers/lightboxes.','Do not invent z-index values outside this map without a new UI revision.']}
          state_map={'schemaVersion':1,'uiRevision':3,'boards':{'public':'.webby/master/system/Public_Component_States.svg','formsOverlays':'.webby/master/system/Form_Overlay_States.svg','admin':'.webby/master/system/Admin_Component_States.svg'},'components':{
              'public.header':{'name':'Header','states':['default','scrolled','mobileDrawerOpen'],'board':'.webby/master/system/Public_Component_States.svg'},
              'public.button.primary':{'name':'PrimaryButton','states':['default','hover','pressed','focus','disabled'],'board':'.webby/master/system/Public_Component_States.svg'},
              'public.property-card':{'name':'PropertyCard','states':['default','hover','unavailable','loading'],'board':'.webby/master/system/Public_Component_States.svg'},
              'public.project-card':{'name':'ProjectCard','states':['default','hover','selected'],'board':'.webby/master/system/Public_Component_States.svg'},
              'public.news-card':{'name':'NewsCard','states':['default','hover','loading'],'board':'.webby/master/system/Public_Component_States.svg'},
              'public.form-field':{'name':'FormField','states':['default','focus','filled','error','disabled'],'board':'.webby/master/system/Form_Overlay_States.svg'},
              'public.filter':{'name':'Filter','states':['default','selected','drawerOpen','empty'],'board':'.webby/master/system/Form_Overlay_States.svg'},
              'public.gallery':{'name':'Gallery','states':['default','lightbox','loading','error'],'board':'.webby/master/system/Form_Overlay_States.svg'},
              'admin.sidebar':{'name':'AdminSidebar','states':['expanded','compact','drawer'],'board':'.webby/master/system/Admin_Component_States.svg'},
              'admin.table':{'name':'AdminTable','states':['default','rowHover','empty','loading'],'board':'.webby/master/system/Admin_Component_States.svg'},
              'admin.form':{'name':'AdminForm','states':['default','dirty','saving','error','success'],'board':'.webby/master/system/Admin_Component_States.svg'},
              'admin.uploader':{'name':'Uploader','states':['empty','uploading','success','error'],'board':'.webby/master/system/Admin_Component_States.svg'}}}
          interactions={'schemaVersion':3,'uiRevision':3,'motion':{'fast':'140ms ease','base':'220ms cubic-bezier(.2,.7,.2,1)'},'interactions':[
              {'component':'Header','event':'scroll > 48px','visualState':'scrolled','layer':'stickyHeader'},
              {'component':'MobileDrawer','event':'menu open','visualState':'mobileDrawerOpen','layers':['drawerBackdrop','drawerPanel'],'keyboard':'focus trap; Escape closes'},
              {'component':'Filter','event':'mobile open','visualState':'drawerOpen','layers':['bottomSheetBackdrop','bottomSheetPanel'],'keyboard':'focus trap; Escape closes'},
              {'component':'Gallery','event':'open image','visualState':'lightbox','layers':['lightboxBackdrop','lightboxContent'],'keyboard':'arrows navigate; Escape closes'},
              {'component':'FormField','event':'invalid submit','visualState':'error','keyboard':'first invalid receives focus; aria-describedby'}]}
          content={'schemaVersion':3,'uiRevision':3,'global':{'brand':'NDTHICH LAND','company':'Công ty TNHH Đầu tư & Kinh doanh Nguyễn Đắc Thích','tagline':'Đầu tư uy tín • Kinh doanh bền vững','hotlinePrimary':'0986 602 203','hotlineSecondary':'0985 551 396','nav':['Trang chủ','Cho thuê','Dự án','Giới thiệu','Tin tức','Liên hệ']},'publicRentalFields':['khu vực','địa chỉ','media','mã/số phòng','giá','phí dịch vụ','diện tích','thang','loại BĐS','mô tả','đặc điểm nổi bật','trạng thái'],'internalOnly':['hoa hồng','người dẫn','ghi chú nội bộ']}
          data_source={'schemaVersion':3,'uiRevision':3,'source':'Google Sheets','spreadsheetId':'1a9zZjpj2KoM856z5hKtG_euci5cU2cLxirPi5B5qqVU','normalizationRules':['Ignore group separator rows.','Normalize price/area to numeric + display values.','Normalize availability/date strings.','Resolve media hyperlinks.','Repair shifted columns before import; never render raw Sheet rows directly.'],'internalOnly':['commission','guide_person','internal_notes']}
          future={'schemaVersion':3,'uiRevision':3,'features':[{'id':'VIEWING_REQUEST_LEADS','status':'FUTURE_FEATURE','activeScope':False,'rule':'Do not implement public booking CTA or admin lead-management in Revision 3.'}]}
          route_map={'schemaVersion':3,'uiRevision':3,'public':[{'route':r,'desktopMaster':f'.webby/master/public/{b}_WEB.svg','mobileMaster':f'.webby/master/public/{b}_MOBILE.svg','desktopRender':f'.webby/visual-handoff/renders/WEB/{b}_WEB.png','mobileRender':f'.webby/visual-handoff/renders/MOBILE/{b}_MOBILE.png'} for r,b in public],
                     'admin':[{'route':'/admin/login','master':'.webby/master/admin/01_Admin_Login.svg'},{'route':'/admin','master':'.webby/master/admin/02_Admin_Dashboard.svg'},{'route':'/admin/bds','master':'.webby/master/admin/03_Admin_BDS_List.svg'},{'route':'/admin/bds/new|edit','master':'.webby/master/admin/04_Admin_BDS_Form.svg'},{'route':'/admin/du-an','master':'.webby/master/admin/05_Admin_DuAn_List.svg'},{'route':'/admin/du-an/new|edit','master':'.webby/master/admin/06_Admin_DuAn_Form.svg'},{'route':'/admin/tin-tuc','master':'.webby/master/admin/07_Admin_TinTuc_List.svg'},{'route':'/admin/tin-tuc/new|edit','master':'.webby/master/admin/08_Admin_TinTuc_Form.svg'},{'route':'/admin/media','master':'.webby/master/admin/09_Admin_Media.svg'}]}
          section_map={'schemaVersion':3,'uiRevision':3,'routes':{'/':['Header','Hero','SearchPanel','FeaturedProperties','FeaturedProjects','AboutPreview','NewsPreview','ContactCTA','Footer'],'/cho-thue':['Header','PageIntro','Search','FilterPanel','PropertyGrid','Pagination','Footer'],'/cho-thue/[slug]':['Header','Breadcrumb','Gallery','PropertySummary','Facts','ContactCTA','Description','Details','Media','Map','RelatedProperties','Footer'],'/du-an':['Header','PageIntro','StatusTabs','ProjectGrid','BrandNote','Footer'],'/du-an/[slug]':['Header','Breadcrumb','ProjectHero','ContactCTA','Intro','ProjectFacts','Map','Amenities','Progress','Gallery','Footer'],'/gioi-thieu':['Header','BrandHero','Stats','Values','BusinessAreas','ContactCTA','Footer'],'/tin-tuc':['Header','PageIntro','SearchCategories','NewsGrid','Pagination','ContactCTA','Footer'],'/tin-tuc/[slug]':['Header','Breadcrumb','ArticleHero','ArticleBody','ContactCTA','RelatedNews','Footer'],'/lien-he':['Header','ContactHero','ContactCards','ContactForm','Map','Footer']}}
          placement={'schemaVersion':3,'uiRevision':3,'placements':[{'id':'global.no-logo','asset':'asset.logos.NO_LOGO','routes':['*'],'placement':'header/footer brand slot','desktopWidth':48,'mobileWidth':44},{'id':'property.media','asset':'asset.placeholders.property-placeholder','routes':['/cho-thue','/cho-thue/[slug]'],'aspectRatio':'4:3','objectFit':'cover','objectPosition':'center'},{'id':'project.media','asset':'asset.placeholders.project-placeholder','routes':['/du-an','/du-an/[slug]'],'aspectRatio':'16:10','objectFit':'cover','objectPosition':'center'},{'id':'news.media','asset':'asset.placeholders.news-placeholder','routes':['/tin-tuc','/tin-tuc/[slug]'],'aspectRatio':'16:9','objectFit':'cover','objectPosition':'center'}]}
          component_map={'version':1,'uiCommit':'PENDING_VISUAL_COMMIT','components':[]}
